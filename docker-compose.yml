services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missionops}
      POSTGRES_USER: ${POSTGRES_USER:-missionops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missionops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missionops} -d ${POSTGRES_DB:-missionops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    command: ["mvn", "-pl", "missionops-api", "-am", "spring-boot:run", "-Dspring-boot.run.profiles=mock"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mock
      POSTGRES_DB: ${POSTGRES_DB:-missionops}
      POSTGRES_USER: ${POSTGRES_USER:-missionops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missionops}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"